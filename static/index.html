<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MiMo Voice Studio · 音色复刻语音生成</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="%238b5cf6"/><stop offset="1" stop-color="%2306b6d4"/></linearGradient></defs><rect width="24" height="24" rx="6" fill="url(%23g)"/><g fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M12 6v12"/><path d="M8 8v8"/><path d="M16 8v8"/><path d="M5 11v2"/><path d="M19 11v2"/></g></svg>'
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body data-history="open">
    <!-- 极光渐变背景层 -->
    <div class="aurora" aria-hidden="true">
      <div class="aurora__blob aurora__blob--violet"></div>
      <div class="aurora__blob aurora__blob--cyan"></div>
      <div class="aurora__blob aurora__blob--pink"></div>
      <div class="aurora__grid"></div>
    </div>

    <!-- 顶部导航 -->
    <header class="topbar">
      <div class="brand">
        <div class="brand__logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v18" />
            <path d="M7 7v10" />
            <path d="M17 7v10" />
            <path d="M2 11v2" />
            <path d="M22 11v2" />
          </svg>
        </div>
        <div class="brand__title">
          <p class="brand__name">MiMo Voice Studio</p>
          <p class="brand__sub">mimo-v2.5-tts-voiceclone</p>
        </div>
      </div>
      <div class="topbar__right">
        <span class="status-pill" id="runtimeStatus">
          <span class="status-pill__dot"></span>
          本地模式
        </span>
        <span class="user-chip" id="userChip" hidden>
          <span class="user-chip__avatar" id="userAvatar">·</span>
          <span class="user-chip__name" id="userName">—</span>
        </span>
        <button id="logoutButton" type="button" class="logout-btn" aria-label="退出登录" title="退出登录" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
        </button>
      </div>
    </header>

    <main class="shell" id="shell">
      <!-- 左：生成工作区 -->
      <section class="workspace">
        <div class="hero">
          <p class="eyebrow">AI Voice Cloning Studio</p>
          <h1 class="hero__title">让文字开口，复刻<span class="hero__accent">任意音色</span></h1>
        </div>

        <form id="generateForm" class="panel" novalidate>
          <div class="panel__grid">
            <!-- 左列：文本输入 -->
            <div class="panel__left">
              <label class="field field--fill" for="text">
                <div class="field__head">
                  <span class="field__label">合成文本</span>
                  <span class="field__counter"><span id="charCount">0</span> / 2000</span>
                </div>
                <textarea
                  id="text"
                  name="text"
                  rows="6"
                  placeholder="输入要转换成语音的内容，比如：你今天还好吗？"
                  maxlength="2000"
                >你今天还好吗?</textarea>
                <small class="field__small">
                  <kbd>⌘</kbd> + <kbd>Enter</kbd> 快速生成
                </small>
              </label>
            </div>

            <!-- 右列：参数设置 -->
            <div class="panel__right">
              <!-- 模型切换 -->
              <div class="field">
                <span class="field__label">
                  <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2" />
                    <line x1="8" y1="21" x2="16" y2="21" />
                    <line x1="12" y1="17" x2="12" y2="21" />
                  </svg>
                  模型
                </span>
                <div class="seg seg--3" role="radiogroup" aria-label="模型类型">
                  <label class="seg__opt">
                    <input type="radio" name="model" value="preset" />
                    <span>预置音色</span>
                  </label>
                  <label class="seg__opt">
                    <input type="radio" name="model" value="design" />
                    <span>音色设计</span>
                  </label>
                  <label class="seg__opt">
                    <input type="radio" name="model" value="clone" checked />
                    <span>音色克隆</span>
                  </label>
                </div>
              </div>

              <!-- 指令 / 描述（语义随模型变化） -->
              <label class="field" for="instruction">
                <span class="field__label">
                  <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 20h9" />
                    <path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4Z" />
                  </svg>
                  <span id="instructionLabel">语气 / 风格</span>
                  <em class="field__optional" id="instructionOptional">可选</em>
                </span>
                <input id="instruction" name="instruction" type="text" placeholder="例如：温柔、自然、语速稍慢" />
                <small class="field__small" id="instructionHint" hidden></small>
              </label>

              <div class="grid grid--2">
                <div class="field">
                  <span class="field__label">调用模式</span>
                  <div class="seg" role="radiogroup" aria-label="调用模式">
                    <label class="seg__opt">
                      <input type="radio" name="mode" value="normal" checked />
                      <span>普通</span>
                    </label>
                    <label class="seg__opt">
                      <input type="radio" name="mode" value="stream" />
                      <span>流式</span>
                    </label>
                  </div>
                </div>

                <div class="field">
                  <span class="field__label">输出格式</span>
                  <div class="seg" role="radiogroup" aria-label="输出格式">
                    <label class="seg__opt">
                      <input type="radio" name="output_format" value="wav" checked />
                      <span>WAV</span>
                    </label>
                    <label class="seg__opt">
                      <input type="radio" name="output_format" value="mp3" />
                      <span>MP3</span>
                    </label>
                  </div>
                </div>
              </div>

              <!-- 音色样本（克隆模式） -->
              <div class="field" id="voiceCloneField">
                <span class="field__label">
                  <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                    <path d="M12 19v3" />
                  </svg>
                  音色样本 <em class="field__optional">可选</em>
                </span>
                <label class="dropzone dropzone--compact" id="voiceDropzone" for="voice">
                  <input id="voice" name="voice" type="file" accept=".wav,.mp3,audio/wav,audio/mpeg" hidden />
                  <div class="dropzone__inner">
                    <svg class="dropzone__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                      <polyline points="17 8 12 3 7 8" />
                      <line x1="12" y1="3" x2="12" y2="15" />
                    </svg>
                    <div class="dropzone__text">
                      <p class="dropzone__main" id="voiceDropzoneText">点击上传 / 拖拽 WAV / MP3</p>
                      <p class="dropzone__hint">默认使用本地「诺艾尔.wav」</p>
                    </div>
                  </div>
                </label>
              </div>

              <!-- 预置音色（preset 模式） -->
              <div class="field" id="presetVoiceField" hidden>
                <span class="field__label">
                  <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 18V5l12-2v13" />
                    <circle cx="6" cy="18" r="3" />
                    <circle cx="18" cy="16" r="3" />
                  </svg>
                  预置音色
                </span>
                <div class="voice-grid" id="presetVoiceGrid">
                  <!-- 由 JS 动态生成 -->
                </div>
                <input type="hidden" name="preset_voice" id="presetVoiceInput" value="mimo_default" />
              </div>

              <!-- 音色设计选项（design 模式） -->
              <div class="field" id="designField" hidden>
                <label class="checkbox-line">
                  <input type="checkbox" name="optimize_text" id="optimizeText" value="true" />
                  <span class="checkbox-line__box" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="20 6 9 17 4 12" />
                    </svg>
                  </span>
                  <span class="checkbox-line__text">
                    <strong>智能润色文本</strong>
                    <small>开启后可不填合成文本，模型会自动生成与音色匹配的示范文本</small>
                  </span>
                </label>
              </div>

              <details class="advanced" id="advancedSettings">
                <summary class="advanced__summary">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="3" />
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" />
                  </svg>
                  <span>API Key</span>
                  <span class="advanced__status" id="apiKeyStatus">检查中…</span>
                </summary>
                <div class="api-key-row">
                  <input id="apiKey" type="password" placeholder="粘贴 MiMo API Key（保存后绑定到当前账号）" autocomplete="off" />
                  <button type="button" id="saveApiKeyButton" class="btn btn--ghost btn--sm">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                      <polyline points="17 21 17 13 7 13 7 21" />
                      <polyline points="7 3 7 8 15 8" />
                    </svg>
                    保存
                  </button>
                </div>
                <small class="field__small" id="apiKeyHint">已保存的 Key 仅本账号可用，不会出现在历史记录里。</small>
              </details>
            </div>
          </div>

          <!-- 操作按钮 -->
          <div class="actions">
            <button id="generateButton" type="submit" class="btn btn--primary">
              <span class="btn__label">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polygon points="5 3 19 12 5 21 5 3" />
                </svg>
                生成语音
              </span>
              <span class="btn__loader" aria-hidden="true">
                <span></span><span></span><span></span><span></span>
              </span>
            </button>
            <button id="refreshButton" type="button" class="btn btn--ghost btn--icon" aria-label="刷新历史" title="刷新历史">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="23 4 23 10 17 10" />
                <polyline points="1 20 1 14 7 14" />
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
              </svg>
            </button>
          </div>

          <div id="message" class="message" hidden></div>
        </form>

        <!-- 最新结果 -->
        <section id="latestResult" class="result" hidden>
          <div class="result__head">
            <div class="result__title">
              <span class="result__badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="20 6 9 17 4 12" />
                </svg>
              </span>
              <div>
                <h2 class="result__heading">最新生成</h2>
                <p class="result__meta" id="resultMeta"></p>
              </div>
            </div>
            <a id="resultDownload" class="btn btn--ghost btn--sm" href="#" download>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
              </svg>
              下载
            </a>
          </div>
          <audio id="resultAudio" controls preload="auto"></audio>
          <p class="result__text" id="resultText"></p>
        </section>
      </section>

      <!-- 右：历史记录 -->
      <aside class="history" id="historyPanel">
        <div class="history-head">
          <div class="history-head__title">
            <h2>历史记录</h2>
            <span id="historyCount" class="history-head__count">0 条</span>
          </div>
          <div class="history-head__actions">
            <button id="clearHistoryButton" type="button" class="btn btn--danger-ghost btn--sm">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="3 6 5 6 21 6" />
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
              </svg>
              清空
            </button>
            <button id="collapseHistoryButton" type="button" class="btn btn--ghost btn--icon btn--sm" aria-label="收起历史" title="收起历史">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="13 17 18 12 13 7" />
                <polyline points="6 17 11 12 6 7" />
              </svg>
            </button>
          </div>
        </div>
        <div id="historyList" class="history-list"></div>
      </aside>

      <!-- 折叠态：右侧悬浮"展开历史"按钮 -->
      <button id="expandHistoryButton" type="button" class="history-toggle" aria-label="展开历史">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="11 17 6 12 11 7" />
          <polyline points="18 17 13 12 18 7" />
        </svg>
        <span class="history-toggle__label">历史</span>
        <span class="history-toggle__count" id="historyToggleCount">0</span>
      </button>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
